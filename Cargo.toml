[package]
name = "dairo-music-search"
version = "2.0.0"
edition = "2024"

# build.rs 专用的依赖
[build-dependencies]

#注解路由代码生成
hyperoute-codegen = "0.0.7"

[dependencies]
tokio = { version = "1", features = ["full"] }

#用来解析启动参数
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

#注解路由
hyperoute-core = "0.0.7"
hyperoute-macro = "0.0.7"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"

#调用YouTube接口、代理下载封面图片
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

#URL编码与解析
url = "2"

[profile.release]
strip = true
lto = true

# 程序退出时结束 yt-dlp 的整个进程组
[target.'cfg(unix)'.dependencies]
libc = "0.2"
